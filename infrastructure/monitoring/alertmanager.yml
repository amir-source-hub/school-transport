global:
  resolve_timeout: 5m
  telegram_api_url: https://tapi.bale.ai

route:
  receiver: platform-warning
  group_by: [alertname, service, environment]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: platform-critical
      matchers: ['severity="critical"']
      group_wait: 10s
      repeat_interval: 30m
    - receiver: platform-info
      matchers: ['severity="info"']
      repeat_interval: 12h

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname, service, instance]

receivers:
  - name: platform-critical
    telegram_configs:
      - bot_token_file: /run/secrets/bale_bot_token
        chat_id_file: /run/secrets/bale_chat_id
        send_resolved: true
        parse_mode: ''
        message: '{{ template "bale.message" . }}'
  - name: platform-warning
    telegram_configs:
      - bot_token_file: /run/secrets/bale_bot_token
        chat_id_file: /run/secrets/bale_chat_id
        send_resolved: true
        parse_mode: ''
        message: '{{ template "bale.message" . }}'
  - name: platform-info
    telegram_configs:
      - bot_token_file: /run/secrets/bale_bot_token
        chat_id_file: /run/secrets/bale_chat_id
        send_resolved: true
        parse_mode: ''
        message: '{{ template "bale.message" . }}'

templates:
  - /etc/alertmanager/templates/*.tmpl
