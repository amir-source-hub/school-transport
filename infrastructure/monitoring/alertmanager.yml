global:
  resolve_timeout: 5m

route:
  receiver: platform-warning
  group_by: [alertname, service, environment]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: platform-critical
      matchers: ['severity="critical"']
      group_wait: 10s
      repeat_interval: 30m
    - receiver: platform-info
      matchers: ['severity="info"']
      repeat_interval: 12h

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname, service, instance]

receivers:
  - name: platform-critical
    webhook_configs:
      - url_file: /run/secrets/alert_webhook_url
        send_resolved: true
        max_alerts: 20
  - name: platform-warning
    webhook_configs:
      - url_file: /run/secrets/alert_webhook_url
        send_resolved: true
        max_alerts: 20
  - name: platform-info
    webhook_configs:
      - url_file: /run/secrets/alert_webhook_url
        send_resolved: true
        max_alerts: 20
