global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: ${DEPLOY_ENV}
    release: ${RELEASE_ID}

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/recording-rules.yml
  - /etc/prometheus/platform-alerts.yml
  - /etc/prometheus/messaging-alerts.yml
  - /etc/prometheus/prometheus-alerts.yml
  - /etc/prometheus/exporter-alerts.yml
  - /etc/prometheus/alertmanager-alerts.yml
  - /etc/prometheus/logging-alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
        labels:
          service: prometheus

  - job_name: school-transport-api
    metrics_path: /api/v1/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_bearer_token
    static_configs:
      - targets: ['api:5000']
        labels:
          service: api

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
        labels: { service: alertmanager }

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
        labels: { service: loki }

  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']
        labels: { service: alloy }

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels: { service: host }

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels: { service: containers }

  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels: { service: postgresql }

  - job_name: redis-exporter
    static_configs:
      - targets: ['redis-exporter:9121']
        labels: { service: redis }

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://samingasht.ir/
          - http://api:5000/api/v1/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
