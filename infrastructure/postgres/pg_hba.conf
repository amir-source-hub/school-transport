# TYPE  DATABASE  USER  ADDRESS      METHOD
# Local administration and entrypoint initialization also require the secret-backed database
# password; the official entrypoint supplies it while processing initialization scripts.
local   all       all                scram-sha-256

# PostgreSQL is reachable only on Compose's internal backend network, but every TCP client must
# still authenticate with SCRAM. These catch-all rules also remain safe if the subnet changes.
host    all       all   0.0.0.0/0    scram-sha-256
host    all       all   ::/0         scram-sha-256
