name: Backend CI

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'infrastructure/**'
      - 'docker-compose.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.env.example'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: school_transport_test
          POSTGRES_USER: school_transport
          POSTGRES_PASSWORD: school_transport_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U school_transport -d school_transport_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://school_transport:school_transport_test@localhost:5432/school_transport_test
      TEST_DATABASE_URL: postgresql://school_transport:school_transport_test@localhost:5432/school_transport_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      CORS_ORIGINS: http://localhost:3000
      OTP_PROVIDER: none
      PAYMENT_GATEWAY_PROVIDER: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @school-transport/api db:migrate:runtime
      - run: pnpm --filter @school-transport/api lint
      - run: pnpm --filter @school-transport/api typecheck
      - run: pnpm --filter @school-transport/api build
      - run: pnpm --filter @school-transport/api test
      - run: pnpm --filter @school-transport/api contract:check
      - run: pnpm audit --audit-level high
