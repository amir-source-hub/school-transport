name: school-transport-production

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the server .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the server .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD through the deployment secret store}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256 --data-checksums
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infrastructure/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,mode=3775
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 60s
    networks:
      - backend

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?Set REDIS_PASSWORD through the deployment secret store}',
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '-a',
          '${REDIS_PASSWORD:?Set REDIS_PASSWORD through the deployment secret store}',
          'ping',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 512m
    cpus: 0.5
    stop_grace_period: 30s
    networks:
      - backend

  api:
    image: school-transport-api:server
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    env_file: &production-environment
      - path: ${PRODUCTION_ENV_FILE:-.env}
        required: true
    environment: &api-environment
      SERVICE_ROLE: api
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 30s
    networks:
      backend: {}
      application: {}
      proxy_api:
        # Keep the API away from Caddy's trusted, reserved proxy address.
        ipv4_address: 172.30.20.3

  worker:
    image: school-transport-api:server
    pull_policy: never
    command: ['node', 'dist/worker.js']
    env_file: *production-environment
    environment:
      SERVICE_ROLE: worker
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'dist/worker-readiness.js']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 150
    mem_limit: 512m
    cpus: 0.75
    stop_grace_period: 45s
    networks:
      - backend

  bootstrap:
    image: school-transport-api:server
    pull_policy: never
    command: ['node', 'dist/database/bootstrap-db.js']
    env_file: *production-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    networks:
      - backend

  web:
    image: school-transport-web:server
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set the public production API URL}
        NEXT_PUBLIC_ASSET_BASE_URL: ${NEXT_PUBLIC_ASSET_BASE_URL:?Set NEXT_PUBLIC_ASSET_BASE_URL to the immutable public asset release URL}
        NEXT_PUBLIC_PRIVATE_UPLOAD_ORIGIN: ${NEXT_PUBLIC_PRIVATE_UPLOAD_ORIGIN:?Set the credential-free S3 upload origin}
        NEXT_DEPLOYMENT_ID: ${NEXT_DEPLOYMENT_ID:?Set NEXT_DEPLOYMENT_ID to the immutable release or commit identifier}
      secrets:
        - next_server_actions_encryption_key
    env_file: *production-environment
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 30s
    networks:
      - frontend
      - application

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    env_file: *production-environment
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 30s
    networks:
      frontend: {}
      proxy_api:
        ipv4_address: 172.30.20.2

networks:
  backend:
    internal: true
  frontend:
  application:
    internal: true
  # Dedicated Caddy-to-API path. The /29 is deterministic and internal; only Caddy gets
  # the single address trusted by Fastify, so web/worker containers cannot spoof XFF.
  proxy_api:
    internal: true
    ipam:
      config:
        - subnet: 172.30.20.0/29

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

secrets:
  next_server_actions_encryption_key:
    environment: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
